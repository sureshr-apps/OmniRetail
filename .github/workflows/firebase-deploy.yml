name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: omniretail-60c71

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed deploy targets
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "Manual run or no previous commit to diff against; deploying everything."
            echo "targets=hosting,functions,dataconnect" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          TARGETS=""
          if echo "$CHANGED" | grep -Eq '^(src/|public/|index\.html|vite\.config|package(-lock)?\.json|tsconfig)'; then
            TARGETS="hosting"
          fi
          if echo "$CHANGED" | grep -q '^functions/'; then
            TARGETS="${TARGETS:+$TARGETS,}functions"
          fi
          if echo "$CHANGED" | grep -q '^dataconnect/'; then
            TARGETS="${TARGETS:+$TARGETS,}dataconnect"
          fi
          if echo "$CHANGED" | grep -Eq '^(\.github/workflows/firebase-deploy\.yml|scripts/(cloud-sql-migration-helpers|drop-app-user-legacy-columns|drop-tenant-legacy-columns|drop-lifecycle-idempotency|drop-service-person-skills|drop-customer-address-columns|migrate-product-taxonomy|drop-product-taxonomy-helper-indexes)\.mjs)$'; then
            TARGETS="${TARGETS:+$TARGETS,}dataconnect"
          fi
          if [ -z "$TARGETS" ]; then
            echo "No deploy-relevant paths changed; deploying everything as a safe default."
            TARGETS="hosting,functions,dataconnect"
          fi
          echo "Deploy targets: $TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm ci --prefix functions --prefer-offline --no-audit --no-fund

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Prepare Product category migration
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/migrate-product-taxonomy.mjs

      - name: Remove retired lifecycle, reconciliation, and audit storage
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/drop-lifecycle-idempotency.mjs

      - name: Remove retired AppUser columns
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/drop-app-user-legacy-columns.mjs

      - name: Remove retired tenant columns
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/drop-tenant-legacy-columns.mjs

      - name: Remove retired customer address columns
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/drop-customer-address-columns.mjs

      - name: Remove unmanaged product taxonomy helper indexes
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/drop-product-taxonomy-helper-indexes.mjs

      - name: Remove retired Service Person and Product columns
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: node scripts/drop-service-person-skills.mjs

      - name: Apply Data Connect SQL schema migration
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: npx --no-install firebase-tools dataconnect:sql:migrate --project "$FIREBASE_PROJECT_ID" --service omniretail-platform --location asia-south1 --force

      - name: Deploy Data Connect schema and connectors
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: npx --no-install firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only dataconnect --non-interactive --force

      - name: Bootstrap RBAC reference data
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: npx --no-install firebase-tools dataconnect:execute dataconnect/bootstrap_rbac.gql BootstrapPlatformRbac --project "$FIREBASE_PROJECT_ID" --service omniretail-platform --location asia-south1 --non-interactive --no-debug-details

      - name: Bootstrap RBAC role permissions
        if: contains(steps.changes.outputs.targets, 'dataconnect')
        run: npx --no-install firebase-tools dataconnect:execute dataconnect/bootstrap_rbac_permissions.gql BootstrapPlatformRbacPermissions --project "$FIREBASE_PROJECT_ID" --service omniretail-platform --location asia-south1 --non-interactive --no-debug-details

      - name: Build frontend
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAyQboFxYrp5xTLGREny35543ICAqreNYM"
          VITE_FIREBASE_AUTH_DOMAIN: "omniretail-60c71.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "omniretail-60c71"
          VITE_FIREBASE_STORAGE_BUCKET: "omniretail-60c71.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1039046217091"
          VITE_FIREBASE_APP_ID: "1:1039046217091:web:8d9d6ca14861e4ae823ab6"
          VITE_FIREBASE_APP_CHECK_SITE_KEY: "6LdA_rQtAAAAAGCKAwQ2Xy2yNmpgVB9vp013I3Y8"
          VITE_USE_FIREBASE_EMULATORS: "false"
        run: npm run build

      - name: Configure Functions deployment parameters
        env:
          OMNIRETAIL_WEB_API_KEY: ${{ secrets.OMNIRETAIL_WEB_API_KEY }}
        run: printf 'OMNIRETAIL_WEB_API_KEY="%s"\n' "$OMNIRETAIL_WEB_API_KEY" > functions/.env.omniretail-60c71

      - name: Deploy Hosting and Functions
        run: |
          TARGETS="${{ steps.changes.outputs.targets }}"
          TARGETS="${TARGETS//,dataconnect/}"
          TARGETS="${TARGETS//dataconnect,/}"
          TARGETS="${TARGETS//dataconnect/}"
          if [ -z "$TARGETS" ]; then
            echo "Data Connect was deployed in its dedicated step; no Hosting or Functions target is required."
            exit 0
          fi
          npx --no-install firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only "$TARGETS" --non-interactive --force
