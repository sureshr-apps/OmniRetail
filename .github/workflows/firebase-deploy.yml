name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: omniretail-60c71

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Build frontend
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAyQboFxYrp5xTLGREny35543ICAqreNYM"
          VITE_FIREBASE_AUTH_DOMAIN: "omniretail-60c71.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "omniretail-60c71"
          VITE_FIREBASE_STORAGE_BUCKET: "omniretail-60c71.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1039046217091"
          VITE_FIREBASE_APP_ID: "1:1039046217091:web:8d9d6ca14861e4ae823ab6"
          VITE_USE_FIREBASE_EMULATORS: "false"
        run: npm run build

      - name: Configure Functions deployment parameters
        env:
          OMNIRETAIL_WEB_API_KEY: ${{ secrets.OMNIRETAIL_WEB_API_KEY }}
        run: printf 'OMNIRETAIL_WEB_API_KEY="%s"\n' "$OMNIRETAIL_WEB_API_KEY" > functions/.env.omniretail-60c71

      - name: Deploy Hosting, Functions, and Data Connect
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting,functions,dataconnect --non-interactive
