mutation CreateTenantExpense($organizationId: UUID!, $expenseNumber: String!, $expenseDate: Date!, $category: String!, $description: String!, $reference: String, $vendorName: String, $outletId: UUID, $scope: String!, $baseAmount: Float!, $taxAmount: Float!, $amount: Float!, $paymentMethod: String!, $paidByEmployee: String!, $submittedBy: String!, $notes: String, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  expense_insert(data: { organization: { id: $organizationId } expenseNumber: $expenseNumber expenseDate: $expenseDate category: $category description: $description reference: $reference vendorName: $vendorName outlet: { id: $outletId } scope: $scope baseAmount: $baseAmount taxAmount: $taxAmount amount: $amount paymentMethod: $paymentMethod paidByEmployee: $paidByEmployee submittedBy: $submittedBy notes: $notes status: ACTIVE approvalStatus: DRAFT })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "expense.created" targetType: "Expense" requestId: $requestId metadata: { organizationId: $organizationId expenseNumber: $expenseNumber } })
}

mutation UpdateTenantExpense($organizationId: UUID!, $id: UUID!, $expenseDate: Date!, $category: String!, $description: String!, $reference: String, $vendorName: String, $scope: String!, $baseAmount: Float!, $taxAmount: Float!, $amount: Float!, $paymentMethod: String!, $paidByEmployee: String!, $notes: String, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { expenses(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Expense is not in this organization.") { id } }
  expense_update(id: $id, data: { expenseDate: $expenseDate category: $category description: $description reference: $reference vendorName: $vendorName scope: $scope baseAmount: $baseAmount taxAmount: $taxAmount amount: $amount paymentMethod: $paymentMethod paidByEmployee: $paidByEmployee notes: $notes updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "expense.updated" targetType: "Expense" targetId: $id requestId: $requestId metadata: { organizationId: $organizationId } })
}

mutation ChangeTenantExpenseApproval($organizationId: UUID!, $id: UUID!, $approvalStatus: ExpenseApprovalStatus!, $reason: String, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { expenses(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Expense is not in this organization.") { id } }
  expense_update(id: $id, data: { approvalStatus: $approvalStatus notes: $reason updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "expense.approval_changed" targetType: "Expense" targetId: $id requestId: $requestId metadata: { organizationId: $organizationId approvalStatus: $approvalStatus reason: $reason } })
}

mutation VoidTenantExpense($organizationId: UUID!, $id: UUID!, $reason: String!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
