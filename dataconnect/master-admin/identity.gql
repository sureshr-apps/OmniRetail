query ListTenantSales($organizationId: UUID!) @auth(level: USER) {
  organizationMemberships(where: { organization: { id: { eq: $organizationId } }, user: { firebaseUid: { eq_expr: "auth.uid" } }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && (this[0].role.code == 'organization.admin' || this[0].role.rolePermissions_on_role.exists(rp, rp.permission.code == 'sales.read'))", message: "Sales access is not available.") { role { code rolePermissions_on_role { permission { code } } } }
  sales(where: { organization: { id: { eq: $organizationId } } }, orderBy: [{ saleTimestamp: DESC }, { id: DESC }]) {
    id organization { id } outlet { id outletCode name } receiptNumber saleTimestamp customer { id customerCode name phone email } customerName staffName channel terminalId tenderType tax discount subtotal totalNet status createdAt
    saleLines_on_sale { id product { id productCode name sku } quantity unitPrice subtotal }
  }
}

mutation CreateTenantSale($organizationId: UUID!, $outletId: UUID!, $receiptNumber: String!, $saleTimestamp: Timestamp!, $customerId: UUID, $customerName: String!, $staffName: String!, $channel: String, $terminalId: String!, $tenderType: SaleTenderType!, $tax: Float!, $discount: Float!, $subtotal: Float!, $totalNet: Float!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { outlets(where: { id: { eq: $outletId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Outlet is not in this organization.") { id } }
  sale_insert(data: { organization: { id: $organizationId } outlet: { id: $outletId } receiptNumber: $receiptNumber saleTimestamp: $saleTimestamp customer: { id: $customerId } customerName: $customerName staffName: $staffName channel: $channel terminalId: $terminalId tenderType: $tenderType tax: $tax discount: $discount subtotal: $subtotal totalNet: $totalNet status: COMPLETED })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "sale.completed" targetType: "Sale" requestId: $requestId metadata: { organizationId: $organizationId receiptNumber: $receiptNumber } })
}

mutation AddTenantSaleLine($organizationId: UUID!, $saleId: UUID!, $outletId: UUID!, $productId: UUID!, $quantity: Float!, $newStockQty: Float!, $unitPrice: Float!, $subtotal: Float!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { sales(where: { id: { eq: $saleId }, organization: { id: { eq: $organizationId } }, outlet: { id: { eq: $outletId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Sale is not in this organization or outlet.") { id } products(where: { id: { eq: $productId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Product is not in this organization.") { id } inventoryStocks(where: { organization: { id: { eq: $organizationId } }, outlet: { id: { eq: $outletId } }, product: { id: { eq: $productId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Inventory item is not available.") { onHandQty } }
  saleLine_insert(data: { sale: { id: $saleId } product: { id: $productId } quantity: $quantity unitPrice: $unitPrice subtotal: $subtotal })
  inventoryStock_update(key: { organizationId: $organizationId outletId: $outletId productId: $productId }, data: { onHandQty: $newStockQty updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "sale.line_added" targetType: "Sale" targetId: $saleId requestId: $requestId metadata: { organizationId: $organizationId productId: $productId quantity: $quantity } })
}

query GetTenantInventoryStockTrusted($organizationId: UUID!, $outletId: UUID!, $productId: UUID!) @auth(level: NO_ACCESS) {
  inventoryStocks(where: { organization: { id: { eq: $organizationId } }, outlet: { id: { eq: $outletId } }, product: { id: { eq: $productId } } }, limit: 1) { onHandQty }
}

mutation VoidTenantSale($organizationId: UUID!, $saleId: UUID!, $reason: String!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { sales(where: { id: { eq: $saleId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Sale is not in this organization.") { id } }
  sale_update(id: $saleId, data: { status: VOIDED })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "sale.voided" targetType: "Sale" targetId: $saleId requestId: $requestId metadata: { organizationId: $organizationId reason: $reason } })
}

