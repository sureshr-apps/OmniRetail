mutation ChangeTenantEmployeeStatusWithLoginTrusted($organizationId: UUID!, $id: UUID!, $userId: UUID!, $status: EmploymentStatus!, $appUserStatus: AppUserStatus!) @auth(level: NO_ACCESS) @transaction {
  query @redact { employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } }, user: { id: { eq: $userId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee identity is not in this organization.") { organization { id } user { id } } }
  employee_update(id: $id, data: { employmentStatus: $status })
  appUser_update(id: $userId, data: { status: $appUserStatus })
}

mutation ChangeTenantEmployeeLoginAccessTrusted($organizationId: UUID!, $id: UUID!, $userId: UUID!, $loginAccess: LoginAccessStatus!) @auth(level: NO_ACCESS) @transaction {
  query @redact { employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } }, user: { id: { eq: $userId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee identity is not in this organization.") { organization { id } user { id } } }
  employee_update(id: $id, data: { loginAccess: $loginAccess })
  appUser_update(id: $userId, data: { status: ACTIVE })
}

# Trusted, server-side read-back for the Employee update/status/login-access
# mutations above (see the note on GetTenantOutletTrusted for why this is a
# separate operation rather than a second `query` block in the same mutation).
query GetTenantEmployeeTrusted($organizationId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) {
    id organization { id } user { id username email firebaseUid employeeTrustedMemberships: organizationMemberships_on_user(where: { organization: { id: { eq: $organizationId } }, status: { eq: ACTIVE } }, limit: 1) { role { code } } } employeeCode fullName email phone designation department gender dateOfBirth dateOfJoining address notes assignmentScope employmentStatus loginAccess
    employeeOutlets_on_employee { outlet { id outletCode name } }
  }
}

