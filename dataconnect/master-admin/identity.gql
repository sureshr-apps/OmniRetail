  }
  organization_update(id: $id, data: { businessName: $businessName legalEntityName: $legalEntityName taxId: $taxId primaryContactName: $primaryContactName email: $email phone: $phone address: $address city: $city state: $state postalCode: $postalCode timezone: $timezone currency: $currency updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid_expr: "auth.uid" action: "organizations.updated" targetType: "Organization" targetId: $id requestId: $requestId })
}

mutation ChangeOrganizationStatus($id: UUID!, $status: OrganizationStatus!, $action: String!, $auditId: UUID!, $requestId: String!) @auth(level: USER) @transaction {
  query @redact {
    appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'organizations.change_status'))", message: "Organization status changes are not available.") { userRoles_on_user { role { rolePermissions_on_role { permission { code } } } } }
