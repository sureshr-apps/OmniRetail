  customer_update(id: $id, data: { type: $type name: $name phone: $phone email: $email taxId: $taxId documentType: $documentType documentValue: $documentValue address: $address creditLimit: $creditLimit preferredContact: $preferredContact dateOfBirth: $dateOfBirth gender: $gender notes: $notes })
}

