    employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0 && this[0].loginAccess == 'DISABLED'", message: "Employee login access must be disabled before deletion.") { id loginAccess }
