mutation UpdateAppUserProfile(
  $userId: UUID!
  $displayName: String!
  $phone: String
  ) @auth(level: USER) @transaction {
  query @redact {
    appUsers(where: { id: { eq: $userId }, firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0", message: "You can only update your own profile.") { id }
  }
  appUser_update(id: $userId, data: {
    displayName: $displayName
    phone: $phone
  })
}


