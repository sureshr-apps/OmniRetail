mutation UpdateOrganizationAdministrator($organizationId: UUID!, $userId: UUID!, $displayName: String!, $phone: String!, $auditId: UUID!, $requestId: String!) @auth(level: USER) @transaction {
  query @redact {
    appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'organization_admins.update'))", message: "Administrator updates are not available.") { userRoles_on_user { role { rolePermissions_on_role { permission { code } } } } }
    organizationMembership(key: { organizationId: $organizationId, userId: $userId }) @check(expr: "this != null", message: "Administrator is not in this organization.") { organizationId userId }
  }
  appUser_update(id: $userId, data: { displayName: $displayName phone: $phone updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid_expr: "auth.uid" action: "organization_administrator.updated" targetType: "AppUser" targetId: $userId requestId: $requestId metadata: { organizationId: $organizationId } })
}

mutation ChangeOrganizationAdministratorStatus($organizationId: UUID!, $userId: UUID!, $status: AppUserStatus!, $membershipStatus: MembershipStatus!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String = "system", $action: String = "organization_administrator.status_changed") @auth(level: NO_ACCESS) @transaction {
  appUser_update(id: $userId, data: { status: $status updatedAt_expr: "request.time" })
  organizationMembership_update(key: { organizationId: $organizationId, userId: $userId }, data: { status: $membershipStatus updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: $action targetType: "AppUser" targetId: $userId requestId: $requestId metadata: { organizationId: $organizationId } })
}

