mutation BootstrapMasterAdmin(
  $userId: UUID!
  $firebaseUid: String!
  $username: String!
  $email: String!
  $displayName: String!
  $phone: String
  $roleId: UUID!
  $auditId: UUID!
  $requestId: String!
) @auth(level: NO_ACCESS) @transaction {
  appUser_upsert(data: {
    id: $userId
    firebaseUid: $firebaseUid
    username: $username
    email: $email
    displayName: $displayName
    phone: $phone
    status: ACTIVE
    updatedAt_expr: "request.time"
  })
  userRole_upsert(data: { userId: $userId, roleId: $roleId })
  auditEvent_upsert(data: {
    id: $auditId
    actorId: $userId
    actorFirebaseUid: $firebaseUid
    action: "bootstrap.master_admin.success"
    targetType: "AppUser"
    targetId: $userId
    requestId: $requestId
  })
}

