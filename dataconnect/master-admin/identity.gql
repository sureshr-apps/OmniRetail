mutation ProvisionOrganizationAdministrator($userId: UUID!, $firebaseUid: String!, $username: String!, $email: String!, $displayName: String!, $phone: String!, $organizationId: UUID!, $roleId: UUID!, $auditId: UUID!, $requestId: String!, $idempotencyKey: String!, $resultReference: String!) @auth(level: NO_ACCESS) @transaction {
  appUser_insert(data: { id: $userId firebaseUid: $firebaseUid username: $username email: $email displayName: $displayName phone: $phone status: ACTIVE })
  organizationMembership_insert(data: { organizationId: $organizationId userId: $userId roleId: $roleId status: ACTIVE })
  userRole_upsert(data: { userId: $userId, roleId: $roleId })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $firebaseUid action: "organization_administrator.created" targetType: "AppUser" targetId: $userId requestId: $requestId metadata: { organizationId: $organizationId } })
  lifecycleIdempotency_update(key: { idempotencyKey: $idempotencyKey }, data: { status: SUCCEEDED resultReference: $resultReference completedAt_expr: "request.time" updatedAt_expr: "request.time" })
}

