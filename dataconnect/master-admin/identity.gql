mutation DeleteLicensePlan($id: UUID!, $auditId: UUID!, $requestId: String!) @auth(level: USER) @transaction {
  query @redact {
    appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'plans.change_status'))", message: "Plan deletion is not available.") { userRoles_on_user { role { rolePermissions_on_role { permission { code } } } } }
    organizationLicenses(where: { plan: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "This plan is assigned to an organization and cannot be deleted.") { id }
    licenseHistories(where: { plan: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "This plan has history and cannot be deleted.") { id }
  }
  licensePlan_delete(id: $id)
  auditEvent_insert(data: { id: $auditId actorFirebaseUid_expr: "auth.uid" action: "plans.deleted" targetType: "LicensePlan" targetId: $id requestId: $requestId })
}

