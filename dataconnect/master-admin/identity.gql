mutation AdjustTenantInventory($organizationId: UUID!, $outletId: UUID!, $productId: UUID!, $mode: InventoryAdjustmentMode!, $quantity: Float!, $previousQty: Float!, $newQty: Float!, $reasonCode: String!, $auditNote: String, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    inventoryStocks(where: { organization: { id: { eq: $organizationId } }, outlet: { id: { eq: $outletId } }, product: { id: { eq: $productId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Inventory item is not in this organization.") { onHandQty }
  }
  inventoryStock_update(key: { organizationId: $organizationId outletId: $outletId productId: $productId }, data: { onHandQty: $newQty updatedAt_expr: "request.time" })
  inventoryMovement_insert(data: { organization: { id: $organizationId } outlet: { id: $outletId } product: { id: $productId } mode: $mode quantity: $quantity previousQty: $previousQty newQty: $newQty reasonCode: $reasonCode auditNote: $auditNote actorFirebaseUid: $actorFirebaseUid requestId: $requestId })
}

mutation CreateTenantInventoryStock($organizationId: UUID!, $outletId: UUID!, $productId: UUID!, $onHandQty: Float!, $reorderLevel: Float!, $overstockThreshold: Float!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    products(where: { id: { eq: $productId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Product is not in this organization.") { id }
    outlets(where: { id: { eq: $outletId }, organization: { id: { eq: $organizationId } }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0", message: "Outlet is not active in this organization.") { id }
  }
  inventoryStock_upsert(data: { organization: { id: $organizationId } outlet: { id: $outletId } product: { id: $productId } onHandQty: $onHandQty reorderLevel: $reorderLevel overstockThreshold: $overstockThreshold })
  inventoryMovement_insert(data: { organization: { id: $organizationId } outlet: { id: $outletId } product: { id: $productId } mode: RECONCILE quantity: $onHandQty previousQty: 0 newQty: $onHandQty reasonCode: "OPENING_STOCK" auditNote: "Initial inventory record created" actorFirebaseUid: $actorFirebaseUid requestId: $requestId })
}

query GetTenantMembershipTrusted($organizationId: UUID!, $firebaseUid: String!) @auth(level: NO_ACCESS) {
  organizationMemberships(where: { organization: { id: { eq: $organizationId } }, user: { firebaseUid: { eq: $firebaseUid } }, status: { eq: ACTIVE } }, limit: 1) {
    organization { id } user { id firebaseUid } role { code scope rolePermissions_on_role { permission { code } } }
  }
}

query ResolveTenantEmployeeIdentityTrusted($organizationId: UUID!, $employeeId: UUID!) @auth(level: NO_ACCESS) {
  employees(where: { id: { eq: $employeeId }, organization: { id: { eq: $organizationId } } }, limit: 1) {
    id
    loginAccess
    user { id firebaseUid }
  }
}

mutation CreateTenantOutlet($organizationId: UUID!, $name: String!, $contactPerson: String!, $email: String, $phone: String!, $address: String!) @auth(level: USER) @transaction {
  query @redact {
    organizationMemberships(where: { organization: { id: { eq: $organizationId } }, user: { firebaseUid: { eq_expr: "auth.uid" } }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && this[0].role.code == 'organization.admin'", message: "Outlet administration is not available.") { role { code } }
