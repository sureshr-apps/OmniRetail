mutation CreateOrganization($id: UUID!, $organizationCode: String!, $businessName: String!, $legalEntityName: String, $taxId: String, $primaryContactName: String!, $email: String!, $phone: String!, $address: String, $city: String, $state: String, $postalCode: String, $timezone: String!, $currency: String!, $auditId: UUID!, $requestId: String!) @auth(level: USER) @transaction {
  query @redact {
    appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'organizations.create'))", message: "Organization creation is not available.") { userRoles_on_user { role { rolePermissions_on_role { permission { code } } } } }
  }
  organization_insert(data: { id: $id organizationCode: $organizationCode businessName: $businessName legalEntityName: $legalEntityName taxId: $taxId primaryContactName: $primaryContactName email: $email phone: $phone address: $address city: $city state: $state postalCode: $postalCode timezone: $timezone currency: $currency status: ACTIVE })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid_expr: "auth.uid" action: "organizations.created" targetType: "Organization" requestId: $requestId })
}

mutation UpdateOrganization($id: UUID!, $businessName: String!, $legalEntityName: String, $taxId: String, $primaryContactName: String!, $email: String!, $phone: String!, $address: String, $city: String, $state: String, $postalCode: String, $timezone: String!, $currency: String!, $auditId: UUID!, $requestId: String!) @auth(level: USER) @transaction {
