  organizationLicense_insert(data: { id: $id organization: { id: $organizationId } plan: { id: $planId } startDate: $startDate expiryDate: $expiryDate negotiatedPrice: $negotiatedPrice currency: $currency })
  licenseHistory_insert(data: { id: $historyId license: { id: $id } organization: { id: $organizationId } eventType: ASSIGNED plan: { id: $planId } planCode: $planCode planName: $planName planLevel: $planLevel maxStores: $maxStores maxUsers: $maxUsers startDate: $startDate expiryDate: $expiryDate negotiatedPrice: $negotiatedPrice currency: $currency })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "license.assigned" targetType: "OrganizationLicense" targetId: $id requestId: $requestId metadata: { organizationId: $organizationId } })
}

