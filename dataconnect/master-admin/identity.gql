mutation AssignTenantEmployeeOutletTrusted($organizationId: UUID!, $employeeId: UUID!, $outletId: UUID!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    employees(where: { id: { eq: $employeeId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee is not in this organization.") { id }
    outlets(where: { id: { eq: $outletId }, organization: { id: { eq: $organizationId } }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0", message: "Outlet is not in this organization or is inactive.") { id }
  }
  employeeOutlet_upsert(data: { employeeId: $employeeId outletId: $outletId })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "employee.outlet_assigned" targetType: "Employee" targetId: $employeeId requestId: $requestId metadata: { organizationId: $organizationId outletId: $outletId } })
}

