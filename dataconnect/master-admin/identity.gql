mutation CreateLicensePlan(
  $planCode: String!
  $name: String!
  $description: String
  $level: Int!
  $maxStores: Int!
  $maxUsers: Int!
  $auditId: UUID!
  $requestId: String!
) @auth(level: USER) @transaction {
  query @redact {
    appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'plans.create'))", message: "Plan creation is not available.") { userRoles_on_user { role { rolePermissions_on_role { permission { code } } } } }
  }
  licensePlan_insert(data: {
    planCode: $planCode
    name: $name
    description: $description
    level: $level
    maxStores: $maxStores
    maxUsers: $maxUsers
    status: ACTIVE
  })
  auditEvent_insert(data: {
    id: $auditId
    actorFirebaseUid_expr: "auth.uid"
    action: "plans.created"
    targetType: "LicensePlan"
    requestId: $requestId
  })
}

