  employees(where: { organization: { id: { eq: $organizationId } } }, orderBy: [{ fullName: ASC }, { id: ASC }], limit: 1000) {
    id organization { id } user { id username email employeeMemberships: organizationMemberships_on_user(where: { organization: { id: { eq: $organizationId } }, status: { eq: ACTIVE } }, limit: 1) { role { code } } } employeeCode fullName email phone designation department gender dateOfBirth dateOfJoining address notes assignmentScope employmentStatus loginAccess
