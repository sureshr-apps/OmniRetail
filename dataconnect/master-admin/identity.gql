query ListOrganizations @auth(level: USER_EMAIL_VERIFIED) {
  appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @redact @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'organizations.read'))", message: "Organization access is not available.") {
    userRoles_on_user { role { rolePermissions_on_role { permission { code } } } }
  }
  organizations(orderBy: [{ createdAt: DESC }, { id: ASC }]) {
    id organizationCode businessName legalEntityName taxId primaryContactName email phone address city state postalCode timezone currency status createdAt updatedAt
  }
}

