# License Plan catalog operations. The embedded active-user checks keep these
# operations unavailable to inactive AppUsers while capability checks remain in
# the trusted plan adapter/functions.
query ListLicensePlans @auth(level: USER) {
  appUsers(where: { firebaseUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: 1) @redact @check(expr: "this.size() > 0 && this[0].userRoles_on_user.exists(ur, ur.role.rolePermissions_on_role.exists(rp, rp.permission.code == 'plans.read'))", message: "Plan access is not available.") { userRoles_on_user { role { rolePermissions_on_role { permission { code } } } } }
  licensePlans(orderBy: [{ level: ASC }], limit: 1000) {
    id
    planCode
    name
    description
    level
    maxStores
    maxUsers
    status
    createdAt
    updatedAt
  }
}

