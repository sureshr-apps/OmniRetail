# Browser-visible authorization bootstrap. Firebase Authentication establishes
# auth.uid; this operation resolves only the matching active application user.
query GetCurrentUserAuthorization @auth(level: USER) {
  appUsers(
    where: {
      firebaseUid: { eq_expr: "auth.uid" }
      status: { eq: ACTIVE }
    }
    limit: 1
  ) {
    id
    firebaseUid
    username
    email
    displayName
    phone
    status
    createdAt
    updatedAt
    userRoles_on_user {
      role {
        code
        name
        scope
        rolePermissions_on_role {
          permission {
            code
          }
        }
      }
    }
  }
}

# Trusted Cloud Functions and bootstrap tooling use Admin SDK operations. These
# operations are never exported through the browser SDK's callable surface.
query GetUserAuthorizationByFirebaseUid($firebaseUid: String!) @auth(level: NO_ACCESS) {
  appUsers(where: { firebaseUid: { eq: $firebaseUid } }, limit: 1) {
    id
    firebaseUid
    username
    email
    displayName
    phone
    status
    createdAt
    updatedAt
    userRoles_on_user {
      role {
        code
        name
        scope
        rolePermissions_on_role {
          permission {
            code
          }
        }
      }
    }
  }
}

query ResolveUsernameLogin($username: String!) @auth(level: NO_ACCESS) {
  appUsers(where: { username: { eq: $username } }, limit: 1) {
    id
    firebaseUid
    email
    status
  }
}

mutation RecordSuccessfulLogin($userId: UUID!, $auditId: UUID!, $requestId: String!)
  @auth(level: NO_ACCESS) @transaction {
  appUser_update(id: $userId, data: {
    lastLoginAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
  auditEvent_insert(data: {
    id: $auditId
    actorId: $userId
    action: "auth.login.success"
    targetType: "AppUser"
    targetId: $userId
    requestId: $requestId
  })
}

