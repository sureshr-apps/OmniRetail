mutation DeleteTenantOutletTrusted($organizationId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    outlets(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Outlet is not in this organization.") { id }
    employeeOutlets(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has employee assignments and cannot be deleted.") { employee { id } }
    servicePersonOutlets(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has service-person assignments and cannot be deleted.") { servicePerson { id } }
    inventoryStocks(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has inventory records and cannot be deleted.") { _id }
    inventoryMovements(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has inventory history and cannot be deleted.") { id }
    purchases(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has purchase history and cannot be deleted.") { id }
    expenses(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has expense history and cannot be deleted.") { id }
    sales(where: { outlet: { id: { eq: $id } } }, limit: 1) @check(expr: "this.size() == 0", message: "Outlet has sales history and cannot be deleted.") { id }
  }
  outlet_delete(id: $id)
}

