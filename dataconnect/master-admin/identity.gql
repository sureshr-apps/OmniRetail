mutation BootstrapMasterAdmin(
  $userId: UUID!
  $firebaseUid: String!
  $username: String!
  $email: String!
  $displayName: String!
  $phone: String
  $roleId: UUID!
  $auditId: UUID!
  $requestId: String!
) @auth(level: NO_ACCESS) @transaction {
  appUser_upsert(data: {
    id: $userId
