mutation AssignTenantEmployeeOutletTrusted($organizationId: UUID!, $employeeId: UUID!, $outletId: UUID!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    employees(where: { id: { eq: $employeeId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee is not in this organization.") { id }
    outlets(where: { id: { eq: $outletId }, organization: { id: { eq: $organizationId } }, status: { eq: ACTIVE } }, limit: 1) @check(expr: "this.size() > 0", message: "Outlet is not in this organization or is inactive.") { id }
  }
  employeeOutlet_upsert(data: { employeeId: $employeeId outletId: $outletId })
}

mutation DeleteTenantEmployeeOutletTrusted($organizationId: UUID!, $employeeId: UUID!, $outletId: UUID!) @auth(level: NO_ACCESS) @transaction {
