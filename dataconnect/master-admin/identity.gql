# Trusted, server-side read-back used immediately after UpdateTenantOutletTrusted /
# ChangeTenantOutletStatusTrusted commit, since Data Connect does not yet support a
# second `query` block in the same transactional mutation (selecting `query` again
# is not supported). This still avoids any browser-to-server round trip: the Cloud
# Function performs this trusted read itself before returning to the caller.
query GetTenantOutletTrusted($organizationId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  outlets(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) {
    id outletCode name contactPerson email phone address status organization { id }
  }
}

mutation CreateTenantEmployeeProfileTrusted($id: UUID!, $organizationId: UUID!, $fullName: String!, $email: String, $phone: String!, $designation: String!, $department: String, $dateOfJoining: Date!, $assignmentScope: String!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  employee_insert(data: { id: $id organization: { id: $organizationId } fullName: $fullName email: $email phone: $phone designation: $designation department: $department dateOfJoining: $dateOfJoining assignmentScope: $assignmentScope employmentStatus: ACTIVE loginAccess: DISABLED })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "employee.created" targetType: "Employee" requestId: $requestId metadata: { organizationId: $organizationId } })
}

mutation ProvisionTenantEmployeeTrusted($id: UUID!, $userId: UUID!, $firebaseUid: String!, $username: String!, $email: String!, $organizationId: UUID!, $fullName: String!, $phone: String!, $designation: String!, $department: String, $dateOfJoining: Date!, $assignmentScope: String!, $roleId: UUID!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  appUser_insert(data: { id: $userId firebaseUid: $firebaseUid username: $username email: $email displayName: $fullName phone: $phone status: ACTIVE })
  organizationMembership_insert(data: { organizationId: $organizationId userId: $userId roleId: $roleId status: ACTIVE })
  userRole_upsert(data: { userId: $userId roleId: $roleId })
  employee_insert(data: { id: $id organization: { id: $organizationId } user: { id: $userId } fullName: $fullName email: $email phone: $phone designation: $designation department: $department dateOfJoining: $dateOfJoining assignmentScope: $assignmentScope employmentStatus: ACTIVE loginAccess: ENABLED })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "employee.login_provisioned" targetType: "Employee" requestId: $requestId metadata: { organizationId: $organizationId } })
}

mutation UpdateTenantEmployeeTrusted($organizationId: UUID!, $id: UUID!, $fullName: String!, $email: String, $phone: String!, $designation: String!, $department: String, $dateOfJoining: Date!, $assignmentScope: String!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee is not in this organization.") { organization { id } } }
  employee_update(id: $id, data: { fullName: $fullName email: $email phone: $phone designation: $designation department: $department dateOfJoining: $dateOfJoining assignmentScope: $assignmentScope updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "employee.updated" targetType: "Employee" targetId: $id requestId: $requestId metadata: { organizationId: $organizationId } })
}

mutation ChangeTenantEmployeeStatusTrusted($organizationId: UUID!, $id: UUID!, $status: EmploymentStatus!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee is not in this organization.") { organization { id } } }
  employee_update(id: $id, data: { employmentStatus: $status updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "employee.status_changed" targetType: "Employee" targetId: $id requestId: $requestId metadata: { organizationId: $organizationId status: $status } })
}

mutation ChangeTenantEmployeeLoginAccessTrusted($organizationId: UUID!, $id: UUID!, $userId: UUID!, $loginAccess: LoginAccessStatus!, $auditId: UUID!, $requestId: String!, $actorFirebaseUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact { employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } }, user: { id: { eq: $userId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee identity is not in this organization.") { organization { id } user { id } } }
  employee_update(id: $id, data: { loginAccess: $loginAccess updatedAt_expr: "request.time" })
  appUser_update(id: $userId, data: { status: ACTIVE updatedAt_expr: "request.time" })
  auditEvent_insert(data: { id: $auditId actorFirebaseUid: $actorFirebaseUid action: "employee.login_access_changed" targetType: "Employee" targetId: $id requestId: $requestId metadata: { organizationId: $organizationId loginAccess: $loginAccess } })
}

# Trusted, server-side read-back for the Employee update/status/login-access
# mutations above (see the note on GetTenantOutletTrusted for why this is a
# separate operation rather than a second `query` block in the same mutation).
query GetTenantEmployeeTrusted($organizationId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  employees(where: { id: { eq: $id }, organization: { id: { eq: $organizationId } } }, limit: 1) {
    id organization { id } user { id username email firebaseUid } employeeCode fullName email phone designation department dateOfJoining assignmentScope employmentStatus loginAccess createdAt updatedAt
    employeeOutlets_on_employee { outlet { id outletCode name } }
  }
}

