  employee_insert(data: { id: $id organization: { id: $organizationId } fullName: $fullName email: $email phone: $phone designation: $designation department: $department gender: $gender dateOfBirth: $dateOfBirth dateOfJoining: $dateOfJoining address: $address notes: $notes assignmentScope: $assignmentScope employmentStatus: ACTIVE loginAccess: DISABLED })
}

mutation ProvisionTenantEmployeeTrusted($id: UUID!, $userId: UUID!, $firebaseUid: String!, $username: String!, $email: String!, $organizationId: UUID!, $fullName: String!, $phone: String!, $designation: String!, $department: String, $gender: String, $dateOfBirth: Date, $dateOfJoining: Date!, $address: String, $notes: String, $assignmentScope: String!, $roleId: UUID!) @auth(level: NO_ACCESS) @transaction {
  appUser_insert(data: { id: $userId firebaseUid: $firebaseUid username: $username email: $email displayName: $fullName phone: $phone status: ACTIVE })
  organizationMembership_insert(data: { organizationId: $organizationId userId: $userId roleId: $roleId status: ACTIVE })
  userRole_upsert(data: { userId: $userId roleId: $roleId })
  employee_insert(data: { id: $id organization: { id: $organizationId } user: { id: $userId } fullName: $fullName email: $email phone: $phone designation: $designation department: $department gender: $gender dateOfBirth: $dateOfBirth dateOfJoining: $dateOfJoining address: $address notes: $notes assignmentScope: $assignmentScope employmentStatus: ACTIVE loginAccess: ENABLED })
}

# Employee login can be provisioned later for a profile created without access.
mutation ProvisionTenantEmployeeLoginTrusted($organizationId: UUID!, $employeeId: UUID!, $userId: UUID!, $firebaseUid: String!, $username: String!, $email: String!, $displayName: String!, $phone: String, $roleId: UUID!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    employees(where: { id: { eq: $employeeId }, organization: { id: { eq: $organizationId } }, loginAccess: { eq: DISABLED } }, limit: 1) @check(expr: "this.size() > 0 && this[0].user == null", message: "Employee already has login access or is not in this organization.") { id user { id } }
  }
  appUser_insert(data: { id: $userId firebaseUid: $firebaseUid username: $username email: $email displayName: $displayName phone: $phone status: ACTIVE })
  organizationMembership_insert(data: { organizationId: $organizationId userId: $userId roleId: $roleId status: ACTIVE })
  userRole_upsert(data: { userId: $userId roleId: $roleId })
  employee_update(id: $employeeId, data: { user: { id: $userId } loginAccess: ENABLED })
}

mutation UpdateTenantEmployeeLoginTrusted($organizationId: UUID!, $employeeId: UUID!, $userId: UUID!, $username: String!, $email: String!, $roleId: UUID!, $loginAccess: LoginAccessStatus!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    employees(where: { id: { eq: $employeeId }, organization: { id: { eq: $organizationId } }, user: { id: { eq: $userId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Employee identity is not in this organization.") { id }
  }
  appUser_update(id: $userId, data: { username: $username email: $email })
  organizationMembership_update(key: { organizationId: $organizationId userId: $userId }, data: { roleId: $roleId status: ACTIVE updatedAt_expr: "request.time" })
  removeAdminRole: userRole_delete(key: { userId: $userId roleId: "00000000-0000-4000-8000-000000000002" })
  removeEmployeeRole: userRole_delete(key: { userId: $userId roleId: "00000000-0000-4000-8000-000000000003" })
  userRole_upsert(data: { userId: $userId roleId: $roleId })
  employee_update(id: $employeeId, data: { loginAccess: $loginAccess })
}

