    outlets(where: { id: { eq: $outletId }, organization: { id: { eq: $organizationId } } }, limit: 1) @check(expr: "this.size() > 0", message: "Outlet is not in this organization.") { id }
  }
  employeeOutlet_delete(key: { employeeId: $employeeId outletId: $outletId })
}

